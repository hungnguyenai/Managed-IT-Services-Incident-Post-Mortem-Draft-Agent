# Agent Manifest — AgentRegistry entry point
# AgentRegistry (mediator/registry/agent_registry.py) reads every key below at
# ROOT level — do NOT nest keys under an `agent:` block. That nested shape is
# invisible to the registry "AgentRegistry manifest schema"
# for the full contract.
id: "SVC-C2-101"
name: "Managed IT Services Incident Post-Mortem Draft Agent"
namespace: "svc-c2-101"
version: "0.1.0"
enabled: true
category: "Cat 2"
industry: "SVC"

# Node-backbone pattern (L2 retired) — base agent type reference
base_type: "VectorRAGAgent"  # RAGAgent | ChatAgent | ReActAgent | DocGenerationAgent

# Entry point — single dotted import path (module.Class), NOT split module:/class:.
# AgentRegistry does `manifest["class"].rsplit(".", 1)` to get (module, class_name).
class: "src.graph.graph.Graph"

# Security
required_trust_level: "INTERNAL"

# Compile-time gates (AgentRegistry._compile_and_cache) — declare every secret/extra
# actually used, or the agent loads with those checks silently disabled. Neither
# ctx.secrets.require() nor an extras_map-registered client is used in src/.
requires:
  secrets: []
  extras: []

# Runtime parameters (max_retry, timeout_s, kb_client, s3_gate_enabled, ...) live in
# config/config.yaml — AgentRegistry loads that file separately and passes it as
# Graph(config=...). Do NOT put them here.
